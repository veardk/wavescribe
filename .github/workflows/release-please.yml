name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v6
        if: ${{ steps.release.outputs.release_created }}
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - uses: actions/setup-node@v6
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci
        if: ${{ steps.release.outputs.release_created }}

      # Last gate before publishing; `npm publish` builds dist/ through `prepack`.
      - run: npm run check
        if: ${{ steps.release.outputs.release_created }}

      # Authorised by npm Trusted Publisher (OIDC, the id-token permission above): no token is stored anywhere.
      - run: npm publish --access public --provenance
        if: ${{ steps.release.outputs.release_created }}
